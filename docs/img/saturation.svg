<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">A dispatch needs hundreds of tiles before the GPU is full</title>
<desc id="d">Line chart: output rate grows from 0.12 GB/s at one tile to 20.3 GB/s at 512 tiles.</desc>
<style>
.bg{fill:#ffffff}.p{fill:#0b0b0b}.s{fill:#52514e}.m{fill:#898781}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}
.c1{fill:#2a78d6}.c2{fill:#eb6834}.c3{fill:#1baf7a}.cg{fill:#898781}.cv{fill:#c9c8c0}
.l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}
.o1{fill:#86b6ef}.o2{fill:#2a78d6}.o3{fill:#104281}
.ring{stroke:#ffffff;stroke-width:2}
.box{fill:#f4f3ef;stroke:#c3c2b7;stroke-width:1}.hi{fill:#cde2fb;stroke:#2a78d6;stroke-width:1}
</style>
<rect width="760" height="344" rx="8" class="bg"/>
<text x="16.0" y="24.0" class="p" font-size="15" font-weight="600" text-anchor="start">A dispatch needs hundreds of tiles before the GPU is full</text>
<text x="16.0" y="43.0" class="s" font-size="12" font-weight="400" text-anchor="start">GB/s of output, kernel time, first n tiles of mozilla on an RX 6650 XT</text>
<line x1="56.0" y1="290.0" x2="690.0" y2="290.0" class="grid"/>
<text x="48.0" y="294.0" class="m" font-size="11" font-weight="400" text-anchor="end">0</text>
<line x1="56.0" y1="235.0" x2="690.0" y2="235.0" class="grid"/>
<text x="48.0" y="239.0" class="m" font-size="11" font-weight="400" text-anchor="end">5</text>
<line x1="56.0" y1="180.0" x2="690.0" y2="180.0" class="grid"/>
<text x="48.0" y="184.0" class="m" font-size="11" font-weight="400" text-anchor="end">10</text>
<line x1="56.0" y1="125.0" x2="690.0" y2="125.0" class="grid"/>
<text x="48.0" y="129.0" class="m" font-size="11" font-weight="400" text-anchor="end">15</text>
<line x1="56.0" y1="70.0" x2="690.0" y2="70.0" class="grid"/>
<text x="48.0" y="74.0" class="m" font-size="11" font-weight="400" text-anchor="end">20</text>
<polyline points="56.0,288.7 267.3,281.5 408.2,256.0 549.1,204.2 690.0,66.7" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="l1"/>
<circle cx="56.0" cy="288.7" r="5" class="c1 ring"><title>1 tiles: 0.12 GB/s, 0.56 ms</title></circle>
<text x="56.0" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">1</text>
<circle cx="267.3" cy="281.5" r="5" class="c1 ring"><title>8 tiles: 0.77 GB/s, 0.68 ms</title></circle>
<text x="267.3" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">8</text>
<circle cx="408.2" cy="256.0" r="5" class="c1 ring"><title>32 tiles: 3.09 GB/s, 0.68 ms</title></circle>
<text x="408.2" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">32</text>
<circle cx="549.1" cy="204.2" r="5" class="c1 ring"><title>128 tiles: 7.8 GB/s, 1.08 ms</title></circle>
<text x="549.1" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">128</text>
<circle cx="690.0" cy="66.7" r="5" class="c1 ring"><title>512 tiles: 20.3 GB/s, 1.65 ms</title></circle>
<text x="690.0" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">512</text>
<text x="64.0" y="274.7" class="p" font-size="12" font-weight="400" text-anchor="start">0.12 GB/s</text>
<text x="700.0" y="70.7" class="p" font-size="12" font-weight="400" text-anchor="start">20.3 GB/s</text>
<line x1="56.0" y1="290.0" x2="690.0" y2="290.0" class="axis"/>
<text x="373.0" y="330.0" class="s" font-size="12" font-weight="400" text-anchor="middle">tiles in one dispatch (64 KB each)</text>
</svg>
