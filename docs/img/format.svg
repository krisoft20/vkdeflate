<text x="16.0" y="43.0" class="s" font-size="12" font-weight="400" text-anchor="start">tiles are independent of each other; inside a tile 32 bitstreams advance together</text>
<text x="16.0" y="84.0" class="s" font-size="12" font-weight="400" text-anchor="start">stream</text>
