<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">A GDeflate stream: tiles of 64 KB, 32 bitstreams in each</title>
<desc id="d">Diagram: a stream is a row of independent 64 KB tiles; each tile interleaves 32 bitstreams.</desc>
<style>
.bg{fill:#ffffff}.p{fill:#0b0b0b}.s{fill:#52514e}.m{fill:#898781}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}
.c1{fill:#2a78d6}.c2{fill:#eb6834}.c3{fill:#1baf7a}.cg{fill:#898781}.cv{fill:#c9c8c0}
.l1{stroke:#2a78d6}.l2{stroke:#eb6834}.l3{stroke:#1baf7a}
.o1{fill:#86b6ef}.o2{fill:#2a78d6}.o3{fill:#104281}
.ring{stroke:#ffffff;stroke-width:2}
.box{fill:#f4f3ef;stroke:#c3c2b7;stroke-width:1}.hi{fill:#cde2fb;stroke:#2a78d6;stroke-width:1}
</style>
<rect width="760" height="250" rx="8" class="bg"/>
