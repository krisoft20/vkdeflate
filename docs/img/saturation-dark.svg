<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">A dispatch needs hundreds of tiles before the GPU is full</title>
<desc id="d">Line chart: output rate grows from 0.08 GB/s at one tile to 7.5 GB/s at 512 tiles.</desc>
<style>
.bg{fill:#0d1117}.p{fill:#f0efec}.s{fill:#c3c2b7}.m{fill:#898781}
.grid{stroke:#2c2c2a;stroke-width:1}.axis{stroke:#383835;stroke-width:1}
.c1{fill:#3987e5}.c2{fill:#d95926}.c3{fill:#199e70}.cg{fill:#898781}
.l1{stroke:#3987e5}.l2{stroke:#d95926}.l3{stroke:#199e70}
.o1{fill:#184f95}.o2{fill:#3987e5}.o3{fill:#9ec5f4}
.ring{stroke:#0d1117;stroke-width:2}
.box{fill:#1a1a19;stroke:#383835;stroke-width:1}.hi{fill:#0d366b;stroke:#3987e5;stroke-width:1}
</style>
<rect width="760" height="344" rx="8" class="bg"/>
<text x="16.0" y="24.0" class="p" font-size="15" font-weight="600" text-anchor="start">A dispatch needs hundreds of tiles before the GPU is full</text>
<text x="16.0" y="43.0" class="s" font-size="12" font-weight="400" text-anchor="start">GB/s of output, kernel time, first n tiles of mozilla on an RX 6650 XT</text>
<line x1="56.0" y1="290.0" x2="690.0" y2="290.0" class="grid"/>
<text x="48.0" y="294.0" class="m" font-size="11" font-weight="400" text-anchor="end">0</text>
<line x1="56.0" y1="235.0" x2="690.0" y2="235.0" class="grid"/>
<text x="48.0" y="239.0" class="m" font-size="11" font-weight="400" text-anchor="end">2</text>
<line x1="56.0" y1="180.0" x2="690.0" y2="180.0" class="grid"/>
<text x="48.0" y="184.0" class="m" font-size="11" font-weight="400" text-anchor="end">4</text>
<line x1="56.0" y1="125.0" x2="690.0" y2="125.0" class="grid"/>
<text x="48.0" y="129.0" class="m" font-size="11" font-weight="400" text-anchor="end">6</text>
<line x1="56.0" y1="70.0" x2="690.0" y2="70.0" class="grid"/>
<text x="48.0" y="74.0" class="m" font-size="11" font-weight="400" text-anchor="end">8</text>
<polyline points="56.0,287.9 267.3,276.1 408.2,240.4 549.1,162.3 690.0,84.2" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" class="l1"/>
<circle cx="56.0" cy="287.9" r="5" class="c1 ring"><title>1 tiles: 0.07 GB/s, 0.88 ms</title></circle>
<text x="56.0" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">1</text>
<circle cx="267.3" cy="276.1" r="5" class="c1 ring"><title>8 tiles: 0.5 GB/s, 1.04 ms</title></circle>
<text x="267.3" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">8</text>
<circle cx="408.2" cy="240.4" r="5" class="c1 ring"><title>32 tiles: 1.8 GB/s, 1.16 ms</title></circle>
<text x="408.2" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">32</text>
<circle cx="549.1" cy="162.3" r="5" class="c1 ring"><title>128 tiles: 4.64 GB/s, 1.81 ms</title></circle>
<text x="549.1" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">128</text>
<circle cx="690.0" cy="84.2" r="5" class="c1 ring"><title>512 tiles: 7.49 GB/s, 4.48 ms</title></circle>
<text x="690.0" y="308.0" class="m" font-size="11" font-weight="400" text-anchor="middle">512</text>
<text x="64.0" y="273.9" class="p" font-size="12" font-weight="400" text-anchor="start">0.08 GB/s</text>
<text x="700.0" y="88.2" class="p" font-size="12" font-weight="400" text-anchor="start">7.5 GB/s</text>
<line x1="56.0" y1="290.0" x2="690.0" y2="290.0" class="axis"/>
<text x="373.0" y="330.0" class="s" font-size="12" font-weight="400" text-anchor="middle">tiles in one dispatch (64 KB each)</text>
</svg>
